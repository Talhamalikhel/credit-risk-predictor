<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .result.low-risk {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .result.medium-risk {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .result.high-risk {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .risk-level {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .probability {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }

        .recommendation {
            font-size: 18px;
            margin-top: 15px;
        }

        .section-title {
            font-size: 20px;
            color: #667eea;
            margin: 25px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🏦 Credit Risk Prediction System</h1>

        <form id="predictionForm">
            <div class="section-title">📊 Basic Information</div>

            <div class="form-group">
                <label>Credit Limit (NT$)</label>
                <input type="number" id="limit_bal" value="200000" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select id="sex" required>
                    <option value="">Select...</option>
                    <option value="1">Male</option>
                    <option value="2" selected>Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Education</label>
                <select id="education" required>
                    <option value="">Select...</option>
                    <option value="1">Graduate School</option>
                    <option value="2" selected>University</option>
                    <option value="3">High School</option>
                    <option value="4">Others</option>
                </select>
            </div>

            <div class="form-group">
                <label>Marital Status</label>
                <select id="marriage" required>
                    <option value="">Select...</option>
                    <option value="1" selected>Married</option>
                    <option value="2">Single</option>
                    <option value="3">Others</option>
                </select>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" value="35" min="18" max="100" required>
            </div>

            <div class="section-title">💳 Payment History (Last 6 Months)</div>

            <div class="form-group">
                <label>September (Most Recent)</label>
                <select id="pay_0" required>
                    <option value="0" selected>Paid on time</option>
                    <option value="1">1 month delay</option>
                    <option value="2">2 months delay</option>
                    <option value="3">3+ months delay</option>
                </select>
            </div>

            <div class="form-group">
                <label>August</label>
                <select id="pay_2" required>
                    <option value="0" selected>Paid on time</option>
                    <option value="1">1 month delay</option>
                    <option value="2">2 months delay</option>
                    <option value="3">3+ months delay</option>
                </select>
            </div>

            <div class="form-group">
                <label>July</label>
                <select id="pay_3" required>
                    <option value="0" selected>Paid on time</option>
                    <option value="1">1 month delay</option>
                    <option value="2">2 months delay</option>
                    <option value="3">3+ months delay</option>
                </select>
            </div>

            <div class="form-group">
                <label>June</label>
                <select id="pay_4" required>
                    <option value="0" selected>Paid on time</option>
                    <option value="1">1 month delay</option>
                    <option value="2">2 months delay</option>
                    <option value="3">3+ months delay</option>
                </select>
            </div>

            <div class="form-group">
                <label>May</label>
                <select id="pay_5" required>
                    <option value="0" selected>Paid on time</option>
                    <option value="1">1 month delay</option>
                    <option value="2">2 months delay</option>
                    <option value="3">3+ months delay</option>
                </select>
            </div>

            <div class="form-group">
                <label>April</label>
                <select id="pay_6" required>
                    <option value="0" selected>Paid on time</option>
                    <option value="1">1 month delay</option>
                    <option value="2">2 months delay</option>
                    <option value="3">3+ months delay</option>
                </select>
            </div>

            <div class="section-title">💰 Bill Amounts (NT$)</div>

            <div class="form-group">
                <label>September Bill</label>
                <input type="number" id="bill_amt1" value="5000" required>
            </div>
            <div class="form-group">
                <label>August Bill</label>
                <input type="number" id="bill_amt2" value="4500" required>
            </div>
            <div class="form-group">
                <label>July Bill</label>
                <input type="number" id="bill_amt3" value="4000" required>
            </div>
            <div class="form-group">
                <label>June Bill</label>
                <input type="number" id="bill_amt4" value="3500" required>
            </div>
            <div class="form-group">
                <label>May Bill</label>
                <input type="number" id="bill_amt5" value="3000" required>
            </div>
            <div class="form-group">
                <label>April Bill</label>
                <input type="number" id="bill_amt6" value="2500" required>
            </div>

            <div class="section-title">💵 Payment Amounts (NT$)</div>

            <div class="form-group">
                <label>September Payment</label>
                <input type="number" id="pay_amt1" value="2000" required>
            </div>
            <div class="form-group">
                <label>August Payment</label>
                <input type="number" id="pay_amt2" value="2000" required>
            </div>
            <div class="form-group">
                <label>July Payment</label>
                <input type="number" id="pay_amt3" value="1500" required>
            </div>
            <div class="form-group">
                <label>June Payment</label>
                <input type="number" id="pay_amt4" value="1500" required>
            </div>
            <div class="form-group">
                <label>May Payment</label>
                <input type="number" id="pay_amt5" value="1000" required>
            </div>
            <div class="form-group">
                <label>April Payment</label>
                <input type="number" id="pay_amt6" value="1000" required>
            </div>

            <button type="submit">🔍 Analyze Credit Risk</button>
        </form>

        <div class="result" id="result">
            <div class="risk-level" id="riskLevel"></div>
            <div class="probability" id="probability"></div>
            <div class="recommendation" id="recommendation"></div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'none';

            const formData = {
                limit_bal: document.getElementById('limit_bal').value,
                sex: document.getElementById('sex').value,
                education: document.getElementById('education').value,
                marriage: document.getElementById('marriage').value,
                age: document.getElementById('age').value,
                pay_0: document.getElementById('pay_0').value,
                pay_2: document.getElementById('pay_2').value,
                pay_3: document.getElementById('pay_3').value,
                pay_4: document.getElementById('pay_4').value,
                pay_5: document.getElementById('pay_5').value,
                pay_6: document.getElementById('pay_6').value,
                bill_amt1: document.getElementById('bill_amt1').value,
                bill_amt2: document.getElementById('bill_amt2').value,
                bill_amt3: document.getElementById('bill_amt3').value,
                bill_amt4: document.getElementById('bill_amt4').value,
                bill_amt5: document.getElementById('bill_amt5').value,
                bill_amt6: document.getElementById('bill_amt6').value,
                pay_amt1: document.getElementById('pay_amt1').value,
                pay_amt2: document.getElementById('pay_amt2').value,
                pay_amt3: document.getElementById('pay_amt3').value,
                pay_amt4: document.getElementById('pay_amt4').value,
                pay_amt5: document.getElementById('pay_amt5').value,
                pay_amt6: document.getElementById('pay_amt6').value
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('riskLevel').textContent = data.risk_level;
                    document.getElementById('probability').textContent = data.probability + '%';
                    document.getElementById('recommendation').textContent = '📋 ' + data.recommendation;

                    resultDiv.className = 'result';
                    if (data.risk_level === 'Low Risk') {
                        resultDiv.classList.add('low-risk');
                    } else if (data.risk_level === 'Medium Risk') {
                        resultDiv.classList.add('medium-risk');
                    } else {
                        resultDiv.classList.add('high-risk');
                    }

                    resultDiv.style.display = 'block';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>

</html>
